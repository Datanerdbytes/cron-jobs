name: purge-senders

on:
  schedule:
    # Daily 23:00 UTC = midnight CET (winter) / 01:00 CEST (summer).
    # GitHub cron is always UTC and has no DST handling.
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      execute:
        description: "Actually move messages to trash (unchecked = dry run)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: purge-senders
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Detect providers with credentials configured
        id: detect
        env:
          EP_GMAIL_USER: ${{ secrets.EP_GMAIL_USER || '' }}
          EP_OUTLOOK_USER: ${{ secrets.EP_OUTLOOK_USER || '' }}
          EP_ICLOUD_USER: ${{ secrets.EP_ICLOUD_USER || '' }}
        run: |
          available=()
          for entry in gmail:EP_GMAIL_USER outlook:EP_OUTLOOK_USER icloud:EP_ICLOUD_USER; do
            name=${entry%%:*}
            var=${entry#*:}
            if [[ -n "${!var}" ]]; then
              available+=("$name")
            fi
          done
          if [[ ${#available[@]} -eq 0 ]]; then
            echo "::error::No provider credentials found. Add repo secrets EP_GMAIL_USER/EP_GMAIL_PASS (and/or EP_OUTLOOK_*, EP_ICLOUD_*)."
            exit 1
          fi
          printf 'providers=%s\n' "$(IFS=,; echo "${available[*]}")" >> "$GITHUB_OUTPUT"

      - name: Purge sender notifications
        env:
          EP_GMAIL_USER: ${{ secrets.EP_GMAIL_USER || '' }}
          EP_GMAIL_PASS: ${{ secrets.EP_GMAIL_PASS || '' }}
          EP_OUTLOOK_USER: ${{ secrets.EP_OUTLOOK_USER || '' }}
          EP_OUTLOOK_PASS: ${{ secrets.EP_OUTLOOK_PASS || '' }}
          EP_ICLOUD_USER: ${{ secrets.EP_ICLOUD_USER || '' }}
          EP_ICLOUD_PASS: ${{ secrets.EP_ICLOUD_PASS || '' }}
          PROVIDERS: ${{ steps.detect.outputs.providers }}
          # Scheduled runs always execute; manual runs only when the "execute"
          # checkbox is ticked, otherwise a safe dry-run.
          EXECUTE: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.execute) }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$EXECUTE" == "true" ]]; then
            args+=(--execute)
          fi
          out="$(python3 purge_senders.py "${args[@]}" --providers "$PROVIDERS")"
          printf '%s\n' "$out"
          {
            printf '### sender-purge — providers: %s — mode: %s\n\n' "$PROVIDERS" "$EXECUTE"
            printf '```\n%s\n```\n' "$out"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update a failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="sender-purge failed"
          body="The sender-purge run failed on $(date -u '+%Y-%m-%d %H:%M UTC').
          Log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --state open --search "$title in:title" \
            --json number --jq '.[0].number' || true)"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
